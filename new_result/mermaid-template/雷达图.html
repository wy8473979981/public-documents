<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Mermaid 流程图编辑器（带缩放/平移/全屏）</title>
    <link rel="stylesheet" href="./statics/mermaid/style.css"/>
</head>

<body>
<div class="chart-title" id="chart-title"></div>
<div class="toolbar">
    <button id="fit-view-btn" title="重置视图">重置</button>
    <button id="zoom-out-btn" title="缩小">-</button>
    <button id="zoom-in-btn" title="放大">+</button>
    <div class="divider"></div>
    <button id="fullscreen-btn" title="全屏">全屏</button>
</div>
<button id="export-btn" title="导出图片">导出图片</button>
<div class="editor-container">
    <div class="preview-panel">
        <div id="mermaid-chart"></div>
    </div>
</div>

<!-- Mermaid 代码数据 -->
<script type="text/mermaid" id="mermaid-data" data-title="候选人能力对比雷达图">
    radar-beta
        axis a["技术深度"], b["沟通能力"], c["项目管理"],d["学习意愿"],e["团队协作"]

        curve a["张三"]{8,6,7,9,8}
        curve b["李四"]{7,8,6,7,6}

        graticule polygon
        max 10
</script>

<script id="label-map-data" type="application/json">
    {
        "theme": "base",
        "themeVariables": {
            "cScale0": "#8979FF",
            "cScale1": "#FF928A",
            "radar": {
                "graticuleColor": "#EAEDF5",
                "graticuleStrokeWidth": 1,
                "axisColor": "#DBDEE4",
                "axisStrokeWidth": 1,
                "curveStrokeWidth": 2
            }
        }
    }
</script>

<!-- 引入 Mermaid 和自定义 JS -->
<script src="./statics/mermaid/mermaid.min.js"></script>
<script src="./statics/mermaid/html-to-image.min.js"></script>
<script src="./statics/mermaid/radar.js"></script>
<script src="./statics/mermaid/export.js"></script>
</body>

</html>
